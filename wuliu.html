<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部系统入口 - 成都新三程</title>
<meta name="description" content="成都新三程内部系统入口，跳转车管系统和物流系统。">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://xinsancheng.cn/wuliu.html">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/chat-widget.css">
<style>
:root{--ink:#162033;--muted:#5c6678;--line:#dfe5ee;--panel:#f6f8fb;--brand:#0b4f4a;--accent:#c47a2c;--white:#fff;--shadow:0 18px 42px rgba(22,32,51,.1)}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:var(--panel);line-height:1.65}
a{color:inherit;text-decoration:none}
.container{width:min(920px,calc(100% - 40px));margin:0 auto}
.site-header{background:#fff;border-bottom:1px solid var(--line)}
.header-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:14px;font-weight:800}
.brand-logo{width:clamp(210px,23vw,288px);height:auto;max-height:48px;object-fit:contain}
.brand-tagline{padding-left:14px;border-left:1px solid rgba(15,118,110,.22);color:var(--muted);font-size:12px;font-weight:700}
.back-link{color:var(--brand);font-size:14px;font-weight:800}
main{padding:74px 0}
.portal{padding:34px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.portal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.portal-head p{margin:0;color:var(--muted)}
h1{margin:0 0 8px;font-size:clamp(30px,5vw,46px);line-height:1.14}
.portal-list{display:grid;gap:12px}
.portal-item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff}
.portal-item strong{display:block;font-size:20px}
.portal-item span{display:block;margin-top:2px;color:var(--muted);font-size:14px}
.button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;color:#fff;background:var(--accent);border-radius:6px;font-weight:900;white-space:nowrap}
.notice{margin:18px 0 0;color:var(--muted);font-size:13px}
footer{padding:24px 0;color:#667085;background:#fff;border-top:1px solid var(--line);font-size:14px}
.footer-inner{display:flex;justify-content:space-between;gap:20px}
@media(max-width:640px){.container{width:min(100% - 28px,920px)}.brand-logo{width:188px}.brand-tagline{display:none}.portal{padding:22px}.portal-head,.portal-item,.footer-inner{align-items:flex-start;grid-template-columns:1fr;flex-direction:column}.button{width:100%}}
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/"><span><img class="brand-logo" src="assets/brand/xinsancheng-logo-full.png" alt="成都新三程汽车销售"></span><span class="brand-tagline">新能源货车资产与运营服务</span></a>
    <a class="back-link" href="/">返回官网</a>
  </div>
</header>
<main>
  <div class="container">
    <section class="portal" aria-label="内部系统入口">
      <div class="portal-head">
        <div>
          <h1>内部系统入口</h1>
          <p>员工点击对应系统进入后台，官网不展示内部数据。</p>
        </div>
      </div>
      <div class="portal-list">
        <a class="portal-item" href="http://127.0.0.1:3020/" target="_blank" rel="noreferrer">
          <span><strong>车管系统</strong><span>车辆、司机、合同、GPS、运营跟进</span></span>
          <span class="button">进入</span>
        </a>
        <a class="portal-item" href="https://saas.junxiaoyao.com/#/" target="_blank" rel="noreferrer">
          <span><strong>物流系统</strong><span>订单、派单、报销、司机流水、回款</span></span>
          <span class="button">进入</span>
        </a>
        <a class="portal-item" href="http://127.0.0.1:3020/logistics" target="_blank" rel="noreferrer">
          <span><strong>运营看板</strong><span>车管和物流数据汇总、异常提醒</span></span>
          <span class="button">进入</span>
        </a>
      </div>
      <p class="notice">提示：车管系统和运营看板当前是本机地址，只适合本机使用；后续可部署到受密码保护的内部子域名。</p>
    </section>
  </div>
</main>
<footer><div class="container footer-inner"><span>成都新三程内部入口</span><span>© 2026 成都新三程</span></div></footer>
<script src="assets/chat-widget.js" defer></script>
</body>
</html>
