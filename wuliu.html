<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>员工安全入口 - 成都新三程</title>
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://xinsancheng.cn/wuliu.html">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<style>
:root{--ink:#162033;--muted:#5c6678;--line:#dfe5ee;--panel:#f6f8fb;--brand:#0b4f4a;--accent:#c47a2c}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:var(--panel);line-height:1.65}
a{color:inherit;text-decoration:none}
.wrap{width:min(760px,calc(100% - 40px));margin:0 auto;padding:88px 0}
.card{padding:34px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 42px rgba(22,32,51,.1)}
.logo{width:min(288px,70vw);height:auto;margin-bottom:28px}
h1{margin:0 0 12px;font-size:clamp(30px,5vw,46px);line-height:1.14}
p{margin:0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.button{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;border-radius:6px;font-weight:900}
.primary{color:#fff;background:var(--accent)}
.secondary{color:var(--brand);border:1px solid var(--line);background:#fff}
.notice{margin-top:18px;font-size:13px}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <img class="logo" src="assets/brand/xinsancheng-logo-full.png" alt="成都新三程汽车销售">
    <h1>员工安全入口</h1>
    <p>这里仅作为内部系统跳转入口。点击进入后会出现账号密码验证，未授权人员无法查看车管、物流、流水和运营数据。</p>
    <div class="actions">
      <a class="button primary" href="http://127.0.0.1:3020/" target="_blank" rel="noreferrer">进入车管系统</a>
      <a class="button secondary" href="/">返回官网首页</a>
    </div>
    <p class="notice">安全说明：后台由服务端密码门禁保护。官网只提供入口，不保存账号密码，不展示任何后台数据。</p>
  </section>
</main>
</body>
</html>
